<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>끄글 끝말잇기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>끄글</h1>
      <p>실시간 한국어 끝말잇기</p>
    </header>

    <section id="lobby" class="card">
      <label>
        닉네임
        <input id="name" maxlength="12" value="플레이어">
      </label>

      <div class="actions">
        <button id="single">AI와 게임</button>
        <button id="create">온라인 방 만들기</button>
      </div>

      <div class="join">
        <input id="roomCode" maxlength="5" placeholder="방 코드">
        <button id="join">방 참가</button>
      </div>

      <p class="hint">
        첫 턴에는 단어 대신 주어진 시작 음절로 시작하는 단어를 입력합니다.
      </p>
    </section>

    <section id="game" class="card hidden">
      <div id="roomLabel"></div>

      <div class="target">
        <span>이어야 할 음절</span>
        <strong id="required">-</strong>
      </div>

      <p id="turn">게임을 시작하세요.</p>

      <div class="input-row">
        <input id="word" autocomplete="off" placeholder="단어 입력">
        <button id="submit">제출</button>
      </div>

      <div class="columns">
        <div>
          <h2>참가자</h2>
          <ul id="players"></ul>
        </div>

        <div>
          <h2>진행 기록</h2>
          <ol id="log"></ol>
        </div>
      </div>

      <button id="back" class="secondary">로비로</button>
    </section>

    <p id="notice" role="status"></p>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
  <script src="script.js"></script>
</body>
</html>
