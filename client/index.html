<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>끝말잇기 AI</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap">
<header><h1>끝말잇기</h1><p>끄글 단어 목록 기반 · AI 5단계 · 온라인 2인</p></header>
<nav class="tabs"><button data-mode="single" class="active">싱글플레이</button><button data-mode="online">온라인 2인</button></nav>
<section id="single" class="panel"><div class="controls"><label>AI 난이도<select id="difficulty"><option value="1">Lv.1 초보</option><option value="2">Lv.2 쉬움</option><option value="3" selected>Lv.3 보통</option><option value="4">Lv.4 어려움</option><option value="5">Lv.5 최강</option></select></label><label>시작 단어<input id="startWord" readonly></label><button id="newStart">랜덤 시작</button></div>
<div class="stats"><b>끝 글자 <span id="last">-</span></b><b>턴 <span id="turn">0</span></b><b>공격 깊이 <span id="depth">-</span></b><b>AI 승률 <span id="winrate">0%</span></b></div><div id="message" class="message"></div><div id="history" class="history"></div><div class="entry"><input id="singleInput" placeholder="단어 입력" autocomplete="off"><button id="singleSend">입력</button></div><button id="restart" class="wide">새 게임</button>
<div class="cards"><div>AI 승리<strong id="wins">0</strong></div><div>플레이어 승리<strong id="losses">0</strong></div><div>전체 게임<strong id="games">0</strong></div><div>평균 길이<strong id="avg">-</strong></div></div></section>
<section id="online" class="panel hidden"><div class="onlineTop"><label>닉네임<input id="name" maxlength="20" placeholder="Player"></label><button id="create">방 만들기</button><label>방 코드<input id="roomCode" maxlength="6" placeholder="X8F2KD"></label><button id="join">방 참가</button></div><div id="roomInfo" class="room"></div><button id="startOnline" class="wide hidden">방장이 게임 시작</button><div id="onlineMessage" class="message"></div><div id="onlineHistory" class="history"></div><div class="entry"><input id="onlineInput" placeholder="내 차례에 단어 입력" autocomplete="off"><button id="onlineSend">입력</button></div></section>
</main><script src="/socket.io/socket.io.js"></script><script src="script.js"></script></body></html>
<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>끝말잇기 AI</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

<main class="wrap">

  <header>
    <h1>끝말잇기 AI</h1>
    <p>끄글 단어 목록 기반 · 끝말잇기 AI · 온라인 2인</p>
  </header>


  <nav class="tabs">

    <button
      data-mode="single"
      class="active"
    >
      싱글플레이
    </button>

    <button
      data-mode="online"
    >
      온라인 2인
    </button>

  </nav>


  <!-- =====================================================
       싱글
  ====================================================== -->

  <section
    id="single"
    class="panel"
  >

    <div class="controls">

      <label>
        시작 단어

        <input
          id="startWord"
          readonly
        >
      </label>

      <button id="newStart">
        랜덤 시작
      </button>

    </div>


    <div class="stats">

      <b>
        끝 글자
        <span id="last">-</span>
      </b>

      <b>
        턴
        <span id="turn">0</span>
      </b>

      <b>
        공격 깊이
        <span id="depth">-</span>
      </b>

      <b>
        AI 승률
        <span id="winrate">50%</span>
      </b>

    </div>


    <div
      id="message"
      class="message"
    ></div>


    <div
      id="history"
      class="history"
    ></div>


    <div class="entry">

      <input
        id="singleInput"
        placeholder="단어 입력"
        autocomplete="off"
      >

      <button id="singleSend">
        입력
      </button>

    </div>


    <button
      id="restart"
      class="wide"
    >
      새 게임
    </button>


    <div class="cards">

      <div>
        AI 승리
        <strong id="wins">0</strong>
      </div>

      <div>
        플레이어 승리
        <strong id="losses">0</strong>
      </div>

      <div>
        전체 게임
        <strong id="games">0</strong>
      </div>

      <div>
        평균 길이
        <strong id="avg">-</strong>
      </div>

    </div>

  </section>


  <!-- =====================================================
       온라인
  ====================================================== -->

  <section
    id="online"
    class="panel hidden"
  >

    <div class="onlineTop">

      <label>
        닉네임

        <input
          id="name"
          maxlength="20"
          placeholder="Player"
        >
      </label>

      <button id="create">
        방 만들기
      </button>


      <label>
        방 코드

        <input
          id="roomCode"
          maxlength="6"
          placeholder="X8F2KD"
        >
      </label>

      <button id="join">
        방 참가
      </button>

    </div>


    <div
      id="roomInfo"
      class="room"
    ></div>


    <button
      id="startOnline"
      class="wide hidden"
    >
      방장이 게임 시작
    </button>


    <div
      id="onlineMessage"
      class="message"
    ></div>


    <div
      id="onlineHistory"
      class="history"
    ></div>


    <div class="entry">

      <input
        id="onlineInput"
        placeholder="내 차례에 단어 입력"
        autocomplete="off"
      >

      <button id="onlineSend">
        입력
      </button>

    </div>

  </section>

</main>


<script src="/socket.io/socket.io.js"></script>
<script src="/script.js"></script>

</body>

</html>
