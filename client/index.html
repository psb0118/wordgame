<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>끝말잇기</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>끝말잇기</h1>
      <p>끄글 단어 목록 기반 · AI · 온라인 멀티플레이</p>
    </header>

    <div class="name-bar">
      <label>닉네임<input id="nickInput" maxlength="12" placeholder="이름을 입력하세요"></label>
      <button id="nickSave">저장</button>
      <span id="nickMsg"></span>
    </div>

    <nav class="tabs">
      <button data-mode="single" class="active">싱글플레이</button>
      <button data-mode="online">온라인 멀티</button>
    </nav>

    <!-- 싱글플레이 -->
    <section id="single" class="panel">
      <div class="single-header">
        <div class="stats">
          <b>시작 <span id="startWord">-</span></b>
          <b>턴 <span id="turn">0</span></b>
          <b>깊이 <span id="depth">-</span></b>
        </div>
        <div class="game-status">
          <span>♥ <span id="hearts">♥♥</span></span>
          <span>실수 <span id="mistakesDisplay">0/5</span></span>
        </div>
      </div>

      <div class="single-game-area">
        <div class="last-char-box">
          <div class="last-char-label">끝 글자</div>
          <div class="last-char" id="last">-</div>
          <div class="last-hint" id="lastHint"></div>
        </div>
        <div class="timer-box">
          <div class="timer-label">남은 시간</div>
          <div class="timer-value" id="timer">-</div>
        </div>
        <div class="turn-indicator" id="turnIndicator"></div>
      </div>

      <div class="rule-notice" id="ruleNotice"></div>

      <div id="message" class="message"></div>

      <div class="history" id="history"></div>

      <div class="single-input-area">
        <input id="singleInput" placeholder="단어 입력" autocomplete="off">
        <button id="hintBtn">힌트</button>
        <button id="singleSend">입력</button>
      </div>

      <div class="single-bottom">
        <button id="restart" class="wide hidden">다시 하기</button>
        <button id="newStart" class="wide secondary">랜덤 시작</button>
      </div>

      <div class="cards">
        <div>플레이어 승리<strong id="wins">0</strong></div>
        <div>AI 승리<strong id="losses">0</strong></div>
        <div>전체 게임<strong id="games">0</strong></div>
        <div>평균 길이<strong id="avg">-</strong></div>
      </div>

      <div class="ranking-section">
        <div class="rank-badge" id="singleRank">-</div>
        <div class="rank-info">
          <span>Rating: <strong id="singleRating">-</strong></span>
        </div>
      </div>

      <button id="adminBtnSingle" class="admin-btn wide secondary hidden">⚙ 관리자 패널</button>
    </section>

    <!-- 온라인 멀티 -->
    <section id="online" class="panel hidden">
      <div class="onlineTop">
        <button id="create">방 만들기</button>
        <label>방 코드<input id="roomCode" maxlength="6" placeholder="X8F2KD"></label>
        <button id="join">방 참가</button>
        <label>초대할 닉네임<input id="onlineInviteInput" maxlength="12" placeholder="친구 닉네임" autocomplete="off"></label>
        <button id="onlineInviteBtn">초대</button>
      </div>

      <div id="roomInfo" class="room"></div>
      <div id="hostControls" class="host-controls hidden">
        <button id="startOnline" class="wide">게임 시작</button>
      </div>
      <div id="onlineMessage" class="message"></div>
      <div class="rule-notice" id="onlineRuleNotice"></div>

      <div class="single-header" id="onlineHeader">
        <div class="stats">
          <b>시작 <span id="onlineStartWord">-</span></b>
          <b>턴 <span id="onlineTurn">0</span></b>
          <b>깊이 <span id="onlineDepth">-</span></b>
        </div>
      </div>
      <div class="game-boxes">
        <div class="last-char-box">
          <div class="last-char-label">끝 글자</div>
          <div class="last-char" id="onlineLast">-</div>
          <div class="last-hint" id="onlineLastHint"></div>
        </div>
        <div class="timer-box">
          <div class="timer-label">남은 시간</div>
          <div class="timer-value" id="onlineTimer">-</div>
        </div>
        <div class="turn-indicator" id="onlineTurnIndicator"></div>
      </div>

      <div id="onlinePlayers" class="players"></div>
      <div id="onlineHistory" class="history"></div>

      <div id="spectatorNotice" class="hidden" style="text-align:center;padding:10px;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);border-radius:8px;margin:8px 0;color:#fca5a5;font-weight:600;">
        관전 모드 — 탈락했습니다
      </div>

      <div class="entry">
        <input id="onlineInput" placeholder="내 차례에 단어 입력" autocomplete="off">
        <button id="onlineSend">입력</button>
      </div>
      <div class="game-status">
        <span>♥ <span id="heartsOnline">♥♥</span></span>
        <span>실수 <span id="mistakesDisplayOnline">0/5</span></span>
      </div>

      <div id="onlineRestartWrap" class="hidden" style="text-align:center;margin:10px 0;">
        <button id="onlineRestart" class="wide">새 게임 시작</button>
      </div>

      <button id="onlineLeave" class="wide secondary">방 나가기</button>

      <div class="ranking-section">
        <div class="rank-badge" id="onlineRank">-</div>
        <div class="rank-info">
          <span>Rating: <strong id="onlineRating">-</strong></span>
        </div>
      </div>

      <div class="lb">
        <button id="loadLb" class="wide secondary">리더보드 보기</button>
        <div id="leaderboard" class="hidden"><div class="lb-heading"></div></div>
      </div>

      <button id="adminBtnOnline" class="admin-btn wide secondary hidden">⚙ 관리자 패널</button>
    </section>
  </main>

  <div id="adminModal" class="modal hidden">
    <div class="modal-box admin-box">
      <div class="admin-head">
        <h3>관리자 패널</h3>
        <button class="modal-close" data-admin-close>✕</button>
      </div>
      <div id="adminBody"></div>
    </div>
  </div>

  <div id="friendsWrap" class="friends-wrap">
    <button id="friendsBtn" class="friends-btn" title="친구 관리">👥 친구<span id="friendsCount" class="friends-count hidden"></span></button>
    <div id="friendsPanel" class="friends-panel hidden">
      <div class="friends-head">
        <span>친구 관리</span>
        <button id="friendsClose" class="friends-close">✕</button>
      </div>
      <div class="friends-add">
        <input id="friendsAddInput" maxlength="12" placeholder="친구 닉네임 입력" autocomplete="off">
        <button id="friendsAddBtn">추가</button>
      </div>
      <div id="friendsList" class="friends-list"></div>
      <div id="friendsMsg" class="friends-msg"></div>
    </div>
  </div>

  <div id="inviteToast" class="invite-toast hidden">
    <span id="inviteText">초대받음</span>
    <button id="inviteAccept">수락</button>
    <button id="inviteDecline" class="secondary">거절</button>
  </div>

  <div id="accountWrap" class="account-wrap">
    <button id="accountBtn" class="account-btn" title="계정">👤 계정</button>
    <div id="accountPanel" class="account-panel hidden">
      <div class="account-head">
        <span>계정</span>
        <button id="accountClose" class="account-close">✕</button>
      </div>
      <div class="account-row">
        <input id="accNickInput" maxlength="12" placeholder="닉네임" autocomplete="off">
        <button id="accApply">저장/로그인</button>
      </div>
      <input type="password" id="accPwInput" maxlength="64" placeholder="계정 비밀번호 (관리자 전용)" autocomplete="off" data-pw-toggle>
      <div id="accountMsg"></div>
      <div class="account-scores">
        <div class="acc-row"><span>싱글 점수</span><strong id="accSingleRating">-</strong><span id="accSingleRank" class="acc-rank"></span></div>
        <div class="acc-row"><span>멀티 점수</span><strong id="accMultiRating">-</strong><span id="accMultiRank" class="acc-rank"></span></div>
      </div>
      <div id="accChangeBox" class="acc-change hidden">
        <div class="acc-change-title">비밀번호 변경 (로그인 후)</div>
        <input type="password" id="accCurPw" placeholder="현재 비밀번호" autocomplete="off" data-pw-toggle>
        <input type="password" id="accNewPw" placeholder="새 비밀번호 (4자 이상)" autocomplete="off" data-pw-toggle>
        <button id="accPwSave" class="wide">비밀번호 변경</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js?v=5"></script>
</body>
</html>
