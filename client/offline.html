<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>오프라인 — 끝말잇기</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 420px; }
    h1 { font-size: 1.5rem; margin: 0 0 10px; }
    p { color: #cbd5e1; line-height: 1.6; font-size: .92rem; }
    button {
      margin-top: 18px;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      background: #7c3aed;
      color: #fff;
      font-weight: 700;
      font-size: .95rem;
      cursor: pointer;
    }
    small { display: block; margin-top: 16px; color: #94a3b8; }
  </style>
</head>
<body>
  <main>
    <h1>📡 오프라인입니다</h1>
    <p>끝말잇기는 서버와 연결되어야 게임을 진행할 수 있어요.<br>단어장은 이 브라우저에 저장되어 있습니다. 연결 후 다시 열어 확인해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 연결하기</button>
    <small>인터넷 연결을 확인한 뒤 다시 시도해 주세요.</small>
  </main>
</body>
</html>
