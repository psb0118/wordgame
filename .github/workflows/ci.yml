name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          for file in $(find client server tools test -name '*.js'); do
            node --check "$file"
          done
      - run: npm test
      - run: npm run lint
      - run: npm run knip
